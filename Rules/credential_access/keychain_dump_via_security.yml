title: Keychain Dump via security CLI
id: d1a2b3c4-0030-4000-a000-000000000030
status: stable
description: Detects use of the macOS security command-line tool to dump or export keychain items.
author: MacCrab Community
date: 2026/03/31
references:
    - https://attack.mitre.org/techniques/T1555/001/
tags:
    - attack.credential_access
    - attack.t1555.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/security'
    selection_dump:
        CommandLine|contains:
            - 'dump-keychain'
            - 'find-generic-password'
            - 'find-internet-password'
            - 'export -t'
            - 'find-certificate'
    filter_system:
        ParentImage|startswith:
            - '/System/'
            - '/usr/libexec/'
            - '/usr/sbin/'
    filter_apple_signed:
        ParentSignerType: 'apple'
    condition: selection and selection_dump and not filter_system and not filter_apple_signed
falsepositives:
    - Legitimate keychain management scripts
    - Backup tools accessing keychain
# /usr/bin/security IS an Apple platform binary, so NoiseFilter Gate 7 dropped
# every match from this rule — silencing the whole keychain-dumping class
# (T1555.001), the canonical macOS stealer technique (AMOS, Banshee). The rule is
# precise enough to bypass noise filtering on its own terms: it requires a dumping
# verb in the command line AND excludes Apple-signed and /System//usr/libexec//usr/sbin
# parents, so securityd and Apple's own tooling cannot trigger it.
suppressible: false
level: medium
