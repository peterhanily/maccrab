title: Reverse Shell Command Detected
id: d1a2b3c4-0042-4000-a000-000000000042
status: stable
description: >
    Detects command-line patterns associated with reverse shell creation across
    representations that trivially evade a single literal: bash/sh /dev/tcp and
    /dev/udp pseudo-device redirects (any spacing or FD form), netcat -e/-c,
    the mkfifo+nc named-pipe form, socket/subprocess Python shells regardless of
    import order, pty.spawn shell upgrades, and PHP fsockopen.
author: MacCrab Community
date: 2026/03/31
modified: 2026/07/24
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://gtfobins.github.io/
tags:
    - attack.execution
    - attack.command_and_control
    - attack.t1059.004
logsource:
    category: process_creation
    product: macos
detection:
    # High-confidence generic catch. bash/zsh's /dev/tcp and /dev/udp pseudo-
    # devices have essentially no benign command-line use; this single selection
    # covers every spacing/redirect/FD variant the old literals missed:
    #   bash -i >&/dev/tcp/...      (no space after >&)
    #   bash -i  >& /dev/tcp/...    (double space)
    #   sh -i >& /dev/tcp/...       (bare sh)
    #   exec 5<>/dev/tcp/...        (FD redirect form)
    selection_devnet:
        CommandLine|contains:
            - '/dev/tcp/'
            - '/dev/udp/'
    # Legacy explicit bash literals kept as belt-and-suspenders.
    selection_bash_reverse:
        CommandLine|contains:
            - 'bash -i >& /dev/tcp/'
            - 'bash -c "bash -i >& /dev/tcp/'
            - '/bin/sh -i >& /dev/tcp/'
    # netcat exec forms.
    selection_nc_reverse:
        CommandLine|contains:
            - 'nc -e /bin/'
            - 'ncat -e /bin/'
            - 'nc -c /bin/'
            - 'ncat -c /bin/'
    # mkfifo + nc named-pipe reverse shell (no -e on modern nc):
    #   mkfifo /tmp/f; cat /tmp/f | /bin/sh -i 2>&1 | nc host port > /tmp/f
    # Requires all three tokens together so a standalone mkfifo or nc is ignored.
    selection_mkfifo_nc:
        CommandLine|contains|all:
            - 'mkfifo'
            - 'nc '
            - 'sh'
    # Python socket reverse shell, import-order independent. Requires the
    # co-occurring socket + subprocess + connect + /bin/ tokens rather than a
    # fixed `import socket,subprocess,os` string, so reordered imports still hit.
    selection_python_socket:
        CommandLine|contains|all:
            - 'socket'
            - 'subprocess'
            - 'connect'
            - '/bin/'
    # Explicit python one-liners kept for exact-order payloads.
    selection_python_literal:
        CommandLine|contains:
            - 'python -c "import socket,subprocess,os'
            - 'python3 -c "import socket,subprocess,os'
            - "python -c 'import socket,subprocess,os"
            - "python3 -c 'import socket,subprocess,os"
    # pty.spawn shell upgrade (T1059.004): python3 -c 'import pty;pty.spawn("/bin/sh")'
    selection_pty_spawn:
        CommandLine|contains:
            - 'pty.spawn("/bin/'
            - "pty.spawn('/bin/"
            - 'pty.spawn("sh"'
            - "pty.spawn('sh'"
            - 'pty.spawn("bash"'
            - "pty.spawn('bash'"
    selection_php_reverse:
        CommandLine|contains: "php -r '$sock=fsockopen"
    condition: >
        selection_devnet or selection_bash_reverse or selection_nc_reverse or
        selection_mkfifo_nc or selection_python_socket or selection_python_literal or
        selection_pty_spawn or selection_php_reverse
falsepositives:
    - Penetration testing activities
    - CTF challenges
    - Rare shell health-check one-liners that open a raw /dev/tcp socket
suppressible: false
level: critical
