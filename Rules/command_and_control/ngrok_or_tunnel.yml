title: Tunnel Service Tool Detected (ngrok/cloudflared/bore)
id: d1a2b3c4-0247-4000-a000-000000000247
status: stable
description: Detects execution of tunnel service tools such as ngrok, cloudflared, bore, or similar. Adversaries use these tools to expose internal services to the internet, bypassing firewalls and establishing covert C2 channels.
author: MacCrab Community
date: 2026/03/30
references:
    - https://attack.mitre.org/techniques/T1572/
tags:
    - attack.command_and_control
    - attack.t1572
logsource:
    category: process_creation
    product: macos
detection:
    selection_binary:
        Image|endswith:
            - '/ngrok'
            - '/cloudflared'
            - '/bore'
            - '/chisel'
            - '/frpc'
            - '/rathole'
    selection_ngrok_args:
        CommandLine|contains:
            - 'ngrok http'
            - 'ngrok tcp'
            - 'ngrok tls'
            - 'ngrok start'
    selection_cloudflared_args:
        CommandLine|contains:
            - 'cloudflared tunnel'
            - 'cloudflared access'
    # v1.21.6 (audit DET-08): see netcat_listener.yml — `ParentSignerType: 'apple'`
    # excluded every shell-launched process (bash/zsh are Apple-signed and are
    # 94.5% of Apple-signed parents on the reference host), which is how an
    # operator, a postinstall script, and a reverse-shell session all launch a
    # tunnel client. Narrow to Apple DAEMON parents by path.
    filter_apple_daemon_parent:
        ParentImage|startswith:
            - '/usr/libexec/'
            - '/System/'
            - '/usr/sbin/'
    condition: (selection_binary or selection_ngrok_args or selection_cloudflared_args) and not filter_apple_daemon_parent
falsepositives:
    - Developers testing webhooks or sharing local services
    - Legitimate Cloudflare Tunnel deployments
level: medium
