title: Netcat Listener Established
id: d1a2b3c4-0241-4000-a000-000000000241
status: stable
description: Detects netcat (nc/ncat) started in listening mode. Adversaries commonly use netcat listeners for reverse shells, file transfers, and backdoor access.
author: MacCrab Community
date: 2026/03/30
references:
    - https://attack.mitre.org/techniques/T1095/
tags:
    - attack.command_and_control
    - attack.execution
    - attack.t1095
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith:
            - '/nc'
            - '/ncat'
            - '/netcat'
    selection_listen:
        CommandLine|contains:
            - ' -l'
            - ' --listen'
    # v1.21.6 (audit DET-08): this was `ParentSignerType: 'apple'`. The name reads
    # as "exclude Apple's own tooling", but /bin/zsh and /bin/bash are Apple-signed
    # — on the reference host they account for 15,316 of the 16,202 process execs
    # with an Apple-signed parent. So the filter actually excluded ANY
    # shell-launched process: `nc -l` typed at a Terminal prompt, run from a
    # malicious postinstall script, or run inside a reverse-shell session. That is
    # exactly the case the rule exists to catch. Narrow the exclusion to Apple
    # DAEMON parents by path, which is what the filter name always meant.
    filter_apple_daemon_parent:
        ParentImage|startswith:
            - '/usr/libexec/'
            - '/System/'
            - '/usr/sbin/'
    condition: selection and selection_listen and not filter_apple_daemon_parent
falsepositives:
    - Network debugging and troubleshooting
    - Development testing of network services
level: medium
