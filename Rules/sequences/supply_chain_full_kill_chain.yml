title: Full Supply Chain Kill Chain - Install to Persist to Exfiltrate
id: e1f2a3b4-0023-4000-b000-000000000023
# v1.21.5: promoted to stable — ran enabled on every install v1.19→v1.21.4 (sequences bypassed the rule profile until v1.21.5) within the measured FP release gate; must-fire kill-chain completion class.
status: stable
description: >
    Detects a supply chain attack chain: a package-manager install, then
    persistence (a LaunchAgent or LaunchDaemon, cron, a .pth file or a shell
    profile) and a network connection to a public address, both from the
    install's descendants.
author: MacCrab Community
date: 2026/03/31
references:
    - https://labs.cloudsecurityalliance.org/research/csa-research-note-teampcp-supply-chain-ai-tooling-20260330-c/
tags:
    - attack.initial_access
    - attack.persistence
    - attack.credential_access
    - attack.exfiltration
    - attack.t1195.001
    - attack.t1543.001
    - attack.t1552.001

type: sequence
window: 300s
correlation: process.lineage
ordered: true

steps:
    - id: package_install
      logsource:
          category: process_creation
          product: macos
      detection:
          selection:
              Image|endswith:
                  - '/npm'
                  - '/npx'
                  - '/pip'
                  - '/pip3'
                  - '/gem'
                  - '/cargo'
              CommandLine|contains:
                  - 'install'
          # npm is a Node script, so `npm install` execs as the node binary
          # with the npm CLI path in its arguments, e.g.
          # `node /opt/homebrew/bin/npm install <pkg>`. Requiring that path
          # plus the install verb keeps other node processes from matching.
          selection_npm_node:
              Image|endswith: '/node'
              CommandLine|contains:
                  - '/npm install'
                  - '/npm-cli.js install'
          condition: selection or selection_npm_node

    - id: persist
      logsource:
          category: file_event
          product: macos
      detection:
          selection_la:
              TargetFilename|contains: '/LaunchAgents/'
          selection_ld:
              TargetFilename|contains: '/LaunchDaemons/'
          selection_cron:
              TargetFilename|startswith: '/private/var/at/tabs/'
          selection_pth:
              TargetFilename|endswith: '.pth'
              TargetFilename|contains: 'site-packages'
          selection_profile:
              TargetFilename|endswith:
                  - '/.zshrc'
                  - '/.bashrc'
                  - '/.bash_profile'
          condition: selection_la or selection_ld or selection_cron or selection_pth or selection_profile
      process: package_install.descendant

    - id: exfil
      logsource:
          category: network_connection
          product: macos
      detection:
          selection:
              DestinationIsPrivate: 'false'
          condition: selection
      process: package_install.descendant

trigger: persist and exfil
falsepositives:
    - Legitimate package post-install hooks (Homebrew casks, pip console_scripts, cargo build scripts) that register LaunchAgents and hit public registries for updates
    - Dev tooling installs that modify .zshrc or .bashrc and then curl/fetch from official CDNs
    - CI/CD agents that install packages, add cron-like triggers, and contact upstream mirrors
suppressible: false
level: high