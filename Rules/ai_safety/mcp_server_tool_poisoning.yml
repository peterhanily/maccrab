title: MCP Server Process Launched With Prompt-Injection Text In Its Command Line
id: d1a2b3c4-3003-4000-a000-000000003003
status: stable
description: >
    Detects an MCP server process (node / python / npx spawned by an AI coding
    tool) whose COMMAND LINE contains prompt-injection text. Scope limit, stated
    honestly: this rule inspects argv only. The canonical "tool poisoning"
    attack — hidden instructions embedded in a tool's `description` or
    `inputSchema` — travels in the JSON-RPC `tools/list` RESPONSE over
    stdio/HTTP and NEVER appears in argv, so this rule cannot detect it. AI-05
    closed part of that gap in CODE rather than here: MCPMonitor now reads the
    LOCAL script a server's `command`/`args` point at and flags tool-poisoning
    instruction text or invisible Unicode TAG characters inside it, surfaced as
    an `mcp_server_suspicious` event. Still undetected: remote and compiled
    servers, and rug pulls where the poisoned description exists only in the
    `tools/list` response and never on disk. What THIS rule catches is the loud
    variant: injection text passed to the server process as an argument.
author: MacCrab Community
date: 2026/04/04
references:
    - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
    - https://owasp.org/www-project-top-10-for-large-language-model-applications/
tags:
    - attack.initial_access
    - attack.execution
    - attack.t1195.002
    - attack.t1059
logsource:
    category: process_creation
    product: macos
detection:
    selection_mcp_process:
        ParentImage|endswith:
            - '/claude'
            - '/cursor'
            - '/code'
            - '/windsurf'
            - '/node'
        Image|endswith:
            - '/node'
            - '/python'
            - '/python3'
            - '/npx'
    # v1.18 audit: the generic override phrases ("ignore all previous",
    # "disregard all prior") also appear in legit tool help/debug text, so they
    # fire alone only when wrapped in a tool-result structured marker (the
    # poisoned-tool-output context). The high-specificity injection phrases fire
    # on their own — they don't occur in benign help text.
    selection_strong_injection:
        CommandLine|contains:
            - 'ignore your instructions'
            - 'system prompt override'
            - 'you must first read'
            - 'do not tell the user'
            - 'hidden instruction'
    selection_structured_marker:
        CommandLine|contains:
            - '<tool_result>'
            - '</tool_result>'
    selection_weak_injection:
        CommandLine|contains:
            - 'ignore all previous'
            - 'disregard all prior'
            - 'IMPORTANT: Before'
    condition: selection_mcp_process and (selection_strong_injection or (selection_structured_marker and selection_weak_injection))
falsepositives:
    - Security testing of MCP server implementations
    - Prompt injection research
level: high