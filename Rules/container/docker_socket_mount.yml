title: Docker Socket Mounted Into Container
id: d1a2b3c4-0421-4000-a000-000000000421
# v1.21.6 (DET-03): promoted experimental -> stable so the `container` tactic
# (0 of 12 active) is not dark. Chosen over the other docker_* rules because it
# keys on the canonical container-escape primitive — mounting the docker socket
# into a container — via an explicit, non-default flag AND-gated with `run`/
# `create`. Volume is bounded by docker CLI invocations. FP: docker-in-docker CI
# and Portainer, which is why it stays `level: medium` and suppressible, so a
# dind developer can silence it without disabling the tactic.
status: stable
description: >
    Detects a container being launched with /var/run/docker.sock mounted as
    a volume. This grants the container full control over the Docker daemon,
    enabling container escape and host compromise.
author: MacCrab Community
date: 2026/04/05
references:
    - https://attack.mitre.org/techniques/T1611/
tags:
    - attack.privilege_escalation
    - attack.t1611
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith:
            - '/docker'
            - '/nerdctl'
            - '/podman'
        CommandLine|contains:
            - ' run '
            - ' create '
    selection_socket:
        CommandLine|contains:
            - '/var/run/docker.sock'
            - '/run/docker.sock'
            - 'docker.sock:'
    condition: selection and selection_socket
falsepositives:
    - Docker-in-Docker CI/CD pipelines
    - Container management tools like Portainer
level: medium
